<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b14"><title>Smart Media</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app-shell">
<header><div class="brand"><div class="logo">S</div><div><b>SMART MEDIA</b><small>تحميلك… بذكاء</small></div></div><span class="status"><i></i> متصل</span></header>
<main>
<section class="hero"><div class="eyebrow">ALL YOUR MEDIA · ONE PLACE</div><h1>حمّل ميديا<br><span>بلا حدود.</span></h1><p>الصق الرابط، اختار الجودة، واستلم ملفك مباشرة.</p></section>
<section class="panel">
<label for="url">رابط الفيديو أو المنشور</label>
<div class="urlbox"><input id="url" type="url" placeholder="https://..." autocomplete="off"><button id="paste" aria-label="لصق">لصق</button></div>
<button class="primary" id="analyze">تحليل الرابط <span>←</span></button>
<div id="error" class="error"></div>
</section>
<section id="preview" class="preview hidden">
<img id="thumb" alt="معاينة" src="">
<div class="meta"><b id="title">عنوان الوسائط</b><small id="details"></small></div>
</section>
<section id="options" class="panel hidden">
<label>اختار نوع التحميل</label>
<div class="segmented"><button class="selected" data-kind="video">🎬 فيديو</button><button data-kind="audio">🎵 صوت MP3</button></div>
<div id="quality-wrap"><label>جودة الفيديو</label><div class="qualities" id="qualities"></div></div>
<button class="primary download" id="download">⬇️ تحميل الآن</button>
<p class="hint">سيتم إرسال الملف إلى جهازك بعد اكتمال المعالجة.</p>
</section>
<div id="busy" class="busy hidden"><div class="spinner"></div><span>جاري تجهيز الملف…</span></div>
</main>
<footer><span>SMART MEDIA</span><span>صُمم لتجربة أسهل ✦</span></footer>
</div>
<script src="/static/app.js"></script>
</body></html>
